name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package (editable, test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite (incl. deletion gate + ablation + advanced analyses)
        run: python -m pytest tests/ -v

      - name: Regenerate demo figures (verifies build scripts stay runnable)
        run: |
          python demo/ablation_benchmark.py
          python demo/advanced_analysis.py
          python demo/build_demo_video.py
